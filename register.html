<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>SkillSwap</h2>
        <a href="index.html">Home</a>
    </header>

    <section class="register">
        <h1>Create Your Profile</h1>

        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>

            <input type="email" id="email" placeholder="Email Address" required>

            <input type="text" id="teachSkill" placeholder="Skill You Can Teach (HTML,CSS,JavaScript)" required>

            <input type="text" id="learnSkill" placeholder="Skill You Want to Learn(Python,Java)" required>

            <button type="submit">Register</button>
        </form>

        <p id="message"></p>
    </section>

    <script src="register.js"></script>
</body>
</html>
