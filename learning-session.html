    <header>

    <section class="register">
        <h1>Learning Session</h1>

        <form id="sessionForm">
            <input
                type="text"
                id="learningTopic"
                placeholder="Learning Topic"
                required
            >

            <textarea
                id="sessionNotes"
                placeholder="Session Notes"
                required
            ></textarea>

          <input
    type="url"
    id="meetingLink"
    placeholder="Paste Google Meet link here"
>

<button type="submit">Save Session</button>  

            <button type="submit">Save Session</button>
        </form>

        <p id="sessionMessage"></p>

        <h2>Saved Session</h2>
        <div id="savedSession"></div>
    </section>

    <script src="learning-session.js"></script>
</body>
